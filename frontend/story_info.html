<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer Studio - Story Info</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/story_info.css?v=1">
    <link rel="icon" type="image/png" href="/img/logo-circle.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="dark">
    <!-- Top Navbar -->
    <header class="top-navbar">
        <a href="/dashboard.html" class="navbar-brand">
            <img src="/img/logo-nopadding.png" alt="Writer Studio Logo" style="height: 32px; margin-right: 8px; vertical-align: middle;">
            Writer Studio
        </a>
        <div class="navbar-actions">
            <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle Theme">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <a href="/profile.html" class="profile-circle" id="profileCircle" title="Profile" style="text-decoration: none;">
                <span id="profileInitial">U</span>
            </a>
        </div>
    </header>

    <div class="layout-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="/dashboard.html" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                My Stories
            </a>
            <a href="/dashboard.html" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                My Series
            </a>
            <a href="/extensions.html" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                Extensions
            </a>
            <div style="flex:1;"></div>
            <div class="nav-item" onclick="logout()" style="color: #ef4444; cursor: pointer;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="hero-container">
                <div class="hero-section">
                    <div class="cover-container">
                <div class="cover-fallback" id="coverFallback">?</div>
                <img id="storyCover" src="" alt="Story Cover">
            </div>
            
            <div class="info-container">
                <div class="title-row">
                    <h1 id="storyTitle">Loading...</h1>
                </div>
                
                <div class="meta-badges" id="metaBadges">
                    <!-- Injected via JS -->
                </div>
                
                <div class="summary-container" id="summaryContainer">
                    <div class="summary" id="storySummary">
                        Loading description...
                    </div>
                    <button class="read-more-btn" id="readMoreBtn" onclick="toggleSummary(event)">Read more</button>
                </div>
                
                <div class="action-bar-modern">
                    <button class="btn-write-large" onclick="openEditor()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        Continue Writing
                    </button>
                    
                    <div class="secondary-actions">
                        <button class="btn-icon-small" onclick="openEditModal()" title="Edit Information">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        </button>
                        <button class="btn-icon-small" onclick="window.location.href='/workspace.html?story_id=' + storyId" title="Write Chapter (Workspace)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                        </button>
                        <button class="btn-icon-small" onclick="exportStory()" title="Export">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </button>
                        <button class="btn-icon-small danger" onclick="deleteStory()" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="chapters-section">
        <div class="chapters-header">
            <h2>Chapters</h2>
        </div>
        <div class="chapter-list" id="chapterList">
            <!-- Loaded via JS -->
            <p style="color: #666;">Loading chapters...</p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Story Info</h2>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm">
                <label class="cover-upload-area" id="coverUploadArea">
                    <div class="cover-upload-content">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--text-color)" stroke-width="2" opacity="0.6" style="margin-bottom:8px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <div>Click to upload cover image</div>
                    </div>
                    <img id="modalCoverPreview" src="" alt="Cover Preview">
                    <input type="file" id="coverUploadInput" accept="image/*" style="display: none;">
                    <input type="hidden" id="coverBase64">
                </label>
                
                <div class="form-group">
                    <label>Title <span style="color:#ef4444">*</span></label>
                    <input type="text" id="editTitle" required>
                </div>
                
                <div class="form-group">
                    <label>Summary / Description</label>
                    <textarea id="editSummary" rows="4" style="resize: vertical;"></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Tags (comma separated)</label>
                        <input type="text" id="editTags" placeholder="e.g. magic, adventure">
                    </div>
                    <div class="form-group">
                        <label>Genre / Types</label>
                        <input type="text" id="editGenre" placeholder="e.g. Fantasy, Romance">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Fandoms</label>
                    <input type="text" id="editFandom" placeholder="e.g. Harry Potter, Marvel">
                </div>
                
                <button type="submit" class="btn" style="margin-top: 16px;">Save Changes</button>
            </form>
        </div>
    </div>
        </main>
    </div>

    <!-- Theme Logic -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !prefersDark)) {
            document.body.classList.remove('dark');
        }
    </script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => {
                    console.log('SW registration failed: ', err);
                });
            });
        }
    </script>
    <script src="/js/story_info.js?v=4"></script>
    <script src="/js/pwa.js"></script>
</body>
</html>
