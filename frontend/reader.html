<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer Studio - Reader View</title>
    <!-- KaTeX for LaTeX support -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fcfcfc;
            color: #333;
            font-family: 'Georgia', serif;
            line-height: 1.8;
        }
        .topbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .back-btn {
            color: #3b7494;
            text-decoration: none;
            font-weight: bold;
            font-family: 'Inter', sans-serif;
        }
        .reader-container {
            max-width: 700px;
            margin: 100px auto 50px auto;
            padding: 0 20px;
            font-size: 18px;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
        }
    </style>
    <link rel="icon" type="image/png" href="/img/logo-circle.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div class="topbar">
        <a href="javascript:window.close()" class="back-btn">&larr; Close Preview</a>
        <div style="font-family: 'Inter', sans-serif; font-size: 14px; color: #666;">Reading Mode</div>
    </div>

    <div class="reader-container">
        <h1 id="readerTitle">Chapter Title</h1>
        <div id="readerContent"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const storyId = urlParams.get('story_id');
        const chapterId = urlParams.get('chapter_id');
        const API_BASE = 'http://127.0.0.1:8000/api'; // Same as other scripts

        // Modify Back Button to go back to previous page
        const backBtn = document.querySelector('.back-btn');
        backBtn.href = 'javascript:window.history.back()';
        backBtn.innerText = '← Go Back';

        if (storyId && chapterId) {
            document.getElementById('readerTitle').innerText = "Loading...";
            document.getElementById('readerContent').innerHTML = "<p style='text-align:center;'>Loading chapter content...</p>";

            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const fetchOptions = token ? { headers: { 'Authorization': `Bearer ${token}` } } : {};

            // Fetch chapter data
            fetch(`${API_BASE}/content/stories/${storyId}/chapters`, fetchOptions)
                .then(res => {
                    if (!res.ok) throw new Error("Failed to fetch (Status: " + res.status + ")");
                    return res.json();
                })
                .then(data => {
                    const chapter = data.find(c => c.id == chapterId);
                    if (chapter) {
                        document.getElementById('readerTitle').innerText = chapter.title || "Untitled Chapter";
                        document.getElementById('readerContent').innerHTML = chapter.content || "<p style='text-align:center;'><em>No content written yet.</em></p>";
                        
                        // Add Edit Button
                        const topbar = document.querySelector('.topbar');
                        const editBtn = document.createElement('a');
                        editBtn.href = `/editor.html?story_id=${storyId}&chapter_id=${chapterId}`;
                        editBtn.style = "font-family: 'Inter', sans-serif; font-size: 14px; background: var(--primary, #3b7494); color: white; padding: 6px 16px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-right: 50px;";
                        editBtn.innerText = "Edit Chapter";
                        topbar.appendChild(editBtn);
                        
                        // Hide the generic "Reading Mode" text if Edit is shown
                        const readingModeText = document.querySelector('.topbar div');
                        if (readingModeText) readingModeText.style.display = 'none';

                    } else {
                        document.getElementById('readerTitle').innerText = "Not Found";
                        document.getElementById('readerContent').innerHTML = "<p style='text-align:center; color: red;'>Chapter not found.</p>";
                    }
                })
                .catch(err => {
                    console.error("Error fetching chapter:", err);
                    document.getElementById('readerTitle').innerText = "Error";
                    document.getElementById('readerContent').innerHTML = "<p style='text-align:center; color: red;'>Failed to load chapter.</p>";
                });
        } else {
            // Fallback to local storage (legacy preview)
            document.getElementById('readerTitle').innerText = localStorage.getItem('reader_title') || "Untitled Chapter";
            document.getElementById('readerContent').innerHTML = localStorage.getItem('reader_content') || "<p>No content found.</p>";
        }
    </script>
    <script src="/js/pwa.js"></script>
</body>
</html>
