<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer Studio - Editor</title>
    <link rel="stylesheet" href="/css/style.css">
    
    <!-- Quill CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- KaTeX for LaTeX support -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.css">
    
    <style>
        body {
            background-color: var(--bg-color);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Bar */
        .editor-topbar {
            height: 60px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        body.dark .editor-topbar {
            background: rgba(18, 18, 18, 0.6);
        }

        .topbar-left, .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: var(--accent-color);
        }

        .save-status {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Editor Layout */
        .editor-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Editor Area */
        .editor-main {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            scroll-behavior: smooth;
        }

        .document-wrapper {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        /* Chapter Title Input */
        .chapter-title-input {
            width: 100%;
            font-size: 3rem;
            font-weight: 700;
            border: none;
            background: transparent;
            color: var(--text-color);
            margin-bottom: 20px;
            padding: 0 15px;
            outline: none;
            font-family: inherit;
        }
        .chapter-title-input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* Quill Customization */
        .ql-toolbar.ql-snow {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            margin-top: 16px;
            z-index: 90;
            box-shadow: var(--shadow-md);
            display: flex;
            justify-content: center;
            transition: opacity 0.3s, transform 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        body.dark .ql-toolbar.ql-snow {
            background: rgba(30, 30, 30, 0.9);
        }
        
        /* Show toolbar when editor is active */
        .editor-main:focus-within .ql-toolbar.ql-snow,
        .ql-toolbar.ql-snow:hover {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, 0);
        }

        #editor-container {
            border: none;
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-color);
            min-height: 50vh;
        }
        
        .ql-container.ql-snow { border: none; }
        .ql-editor { padding: 0 15px; font-family: inherit; }
        .ql-editor.ql-blank::before {
            color: var(--text-muted);
            font-style: italic;
            left: 15px;
        }

        /* Paragraph Spacing for Body Text */
        .ql-editor p {
            margin-bottom: 1.2em;
            line-height: 1.8;
            font-size: 1.15rem;
        }

        /* Comments Styling */
        .comment-marker {
            background-color: transparent;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .comment-marker:hover {
            border-bottom: 2px solid rgba(255, 235, 59, 0.5);
        }

        /* Sidebar Comment Icons Container */
        #commentsGutter {
            position: absolute;
            top: 0;
            right: -20px;
            width: 40px;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .gutter-comment-icon {
            position: absolute;
            background: var(--accent-color); /* Blue dot */
            border: 2px solid var(--surface);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 0 2px transparent;
            transition: all 0.2s;
            right: 0;
            z-index: 55;
        }
        .gutter-comment-icon:hover, .gutter-comment-icon.active {
            transform: scale(1.4);
            box-shadow: 0 0 0 2px rgba(var(--accent-color-rgb), 0.3);
        }

        /* Floating Comment Add Button */
        #addCommentBtn {
            position: absolute;
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            z-index: 100;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            transition: transform 0.1s;
        }
        #addCommentBtn:hover {
            transform: scale(1.1);
            color: var(--accent-color);
        }

        #viewCommentPopup {
            position: absolute;
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 280px;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: var(--shadow-lg);
            z-index: 105;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.2s;
        }
        body.dark #viewCommentPopup {
            background: rgba(30, 30, 30, 0.95);
        }
        #viewCommentPopup textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            background: var(--bg-color);
            color: var(--text-color);
            resize: vertical;
            font-family: inherit;
            min-height: 70px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        #viewCommentPopup textarea:focus {
            border-color: var(--accent-color);
        }
        .comment-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .comment-actions button {
            padding: 4px 10px;
            font-size: 0.85rem;
        }

        /* Floating Notes Sidebar */
        .notes-panel {
            position: fixed;
            right: -350px;
            top: 76px;
            bottom: 24px;
            width: 320px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 80;
            overflow: hidden;
        }
        .notes-panel.open {
            right: 24px;
        }

        .notes-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notes-header h3 { margin: 0; font-size: 1.1rem; }
        
        #notesContent {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-color);
            padding: 20px;
            resize: none;
            font-family: inherit;
            line-height: 1.6;
            outline: none;
        }

        /* Action Buttons */
        .btn-toggle-notes {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-toggle-notes:hover {
            background: var(--border);
        }
    </style>
    <link rel="icon" type="image/png" href="/img/logo-circle.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="dark">
    
    <div class="editor-topbar">
        <div class="topbar-left">
            <a href="#" id="backToWorkspace" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Workspace
            </a>
            
            <select id="chapterTypeSelect" class="chapter-type-select custom-select" style="
                margin-left: 16px;
                padding: 4px 8px;
                background: transparent;
                color: var(--text-color);
                border: 1px solid var(--border);
                border-radius: 4px;
                font-size: 0.9rem;
                outline: none;
            ">
                <option value="Standard Chapter">Standard Chapter</option>
                <option value="Author's Note">Author's Note</option>
                <option value="Explanation">Explanation</option>
                <option value="Prologue">Prologue</option>
                <option value="Epilogue">Epilogue</option>
            </select>

            <div class="save-status" id="saveStatus">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                Saved
            </div>
        </div>
        <div class="topbar-right">
            <button class="btn-toggle-notes" onclick="toggleNotes()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                Notes
            </button>
            <button class="btn" style="padding: 8px 20px;" onclick="forceSave()">Save Now</button>
        </div>
    </div>

    <div class="editor-layout">
        <div class="editor-main" id="editorMain">
            <div class="document-wrapper">
                <input type="text" id="chapterTitle" class="chapter-title-input" placeholder="Chapter Title">
                <div id="editor-container"></div>
                
                <!-- Container for sidebar comment icons -->
                <div id="commentsGutter"></div>

                <!-- Comment Add Button -->
                <div id="addCommentBtn" title="Add Comment">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </div>
                
                <!-- View/Edit Comment Popup -->
                <div id="viewCommentPopup">
                    <textarea id="commentTextInput" placeholder="Write a comment..."></textarea>
                    <div class="comment-actions">
                        <button class="btn btn-danger" id="deleteCommentBtn" style="background:var(--error);border:none;color:white;cursor:pointer;">Delete</button>
                        <button class="btn" id="cancelCommentBtn" style="background:var(--bg-color);border:1px solid var(--border);color:var(--text-color);cursor:pointer;">Cancel</button>
                        <button class="btn" id="saveCommentBtn">Save</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Floating Notes Panel -->
        <div class="notes-panel" id="notesPanel">
            <div class="notes-header">
                <h3>Chapter Notes</h3>
                <button class="icon-btn" onclick="toggleNotes()" style="width:28px;height:28px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <textarea id="notesContent" placeholder="Jot down notes specific to this chapter..."></textarea>
        </div>
    </div>

    <!-- Theme Logic (Inherited from Workspace but enforced via localStorage) -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !prefersDark)) {
            document.body.classList.remove('dark');
        }
    </script>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="/js/editor.js?v=2"></script>
    <script src="/js/pwa.js"></script>
</body>
</html>
