<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer Studio - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css?v=1">
    <link rel="icon" type="image/png" href="/img/logo-circle.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <!-- Theme Logic (Inline to avoid flash) -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.body.classList.add('dark');
        }
    </script>
    <!-- Top Navbar -->
    <header class="top-navbar">
        <a href="/dashboard.html" class="navbar-brand">
            <img src="/img/logo-nopadding.png" alt="Writer Studio Logo" style="height: 32px; margin-right: 8px; vertical-align: middle;">
            Writer Studio
        </a>
        
        <div class="navbar-actions" style="position: relative;">
            <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle Theme">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <a href="/notifications.html" class="icon-btn" aria-label="Notifications" style="text-decoration: none; color: inherit;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </a>
            <a href="/settings.html" class="icon-btn" aria-label="Settings" style="text-decoration: none; color: inherit;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </a>
            <a href="/profile.html" class="profile-circle" id="profileCircle" style="text-decoration: none; color: inherit;">
                <span id="profileInitial">U</span>
                <img id="profileImage" src="" alt="" style="display: none;">
            </a>
        </div>
    </header>

    <div class="layout-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="nav-item" onclick="window.location.href='/dashboard.html'" id="nav-stories">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                My Stories
            </div>
            <div class="nav-item" onclick="window.location.href='/dashboard.html'" id="nav-series">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                My Series
            </div>
            <div class="nav-item" onclick="window.location.href='/extensions.html'">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                Extensions
            </div>
            <div style="flex:1;"></div>
            <div class="nav-item logout-btn" onclick="logout()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header">
                <h1>Notifications</h1>
                <button class="btn" style="background: var(--surface-white); color: var(--text-color); border: 1px solid var(--border-soft);" onclick="markAllRead()" id="markAllBtn">Mark all as read</button>
            </div>
            
            <div style="max-width: 800px; display: flex; flex-direction: column; gap: 16px;" id="notificationsContainer">
                <div style="background: var(--surface-white); border: 1px solid var(--border-soft); border-radius: 20px; padding: 64px 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.02); text-align: center; color: var(--text-muted);" id="emptyState">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity: 0.3; margin-bottom: 16px;"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <h3 style="margin: 0 0 8px 0; font-size: 1.2rem; color: var(--text-main);">Loading notifications...</h3>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav">
        <div class="nav-item active" onclick="window.location.href='/dashboard.html'">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            Stories
        </div>
        <div class="nav-item" onclick="window.location.href='/dashboard.html'">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
            Series
        </div>
        <div class="nav-item" onclick="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Logout
        </div>
    </nav>


    <!-- Create / Edit Modal -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create New</h2>
                <button class="close-btn" onclick="closeCreateModal()">&times;</button>
            </div>
            <form id="createForm">
                <input type="hidden" id="editItemId">
                
                <label class="cover-upload-area" id="coverUploadArea">
                    <div class="cover-upload-content">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--text-color)" stroke-width="2" opacity="0.6" style="margin-bottom:8px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <div>Click to upload cover image</div>
                    </div>
                    <img id="coverPreview" src="" alt="Cover Preview">
                    <input type="file" id="coverUploadInput" accept="image/*" style="display: none;">
                    <input type="hidden" id="coverBase64">
                </label>
                
                <div class="form-group">
                    <label>Title <span style="color:#ef4444">*</span></label>
                    <input type="text" id="createTitle" required>
                </div>
                
                <div class="form-group">
                    <label>Summary / Description</label>
                    <textarea id="createSummary" rows="3" style="resize: vertical;"></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Tags (comma separated)</label>
                        <input type="text" id="createTags" placeholder="e.g. magic, adventure">
                    </div>
                    <div class="form-group">
                        <label>Genre / Types</label>
                        <input type="text" id="createGenre" placeholder="e.g. Fantasy, Romance">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Fandoms</label>
                    <input type="text" id="createFandom" placeholder="e.g. Harry Potter, Marvel">
                </div>
                
                <button type="submit" class="btn" style="margin-top: 16px;">Save Details</button>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const themeBtn = document.getElementById('themeToggleBtn');
            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    document.body.classList.toggle('dark');
                    const isDark = document.body.classList.contains('dark');
                    localStorage.setItem('theme', isDark ? 'dark' : 'light');
                    
                    const moon = document.getElementById('moonIcon');
                    const sun = document.getElementById('sunIcon');
                    if(moon && sun) {
                        moon.style.display = isDark ? 'block' : 'none';
                        sun.style.display = isDark ? 'none' : 'block';
                    }
                });
            }

            // Load user profile header data
            const resUser = await apiFetch("/auth/users/me");
            if (resUser && resUser.ok) {
                const user = await resUser.json();
                if (user.username) {
                    document.getElementById('profileInitial').textContent = user.username.charAt(0).toUpperCase();
                }
            }
            
            await loadNotifications();
        });

        async function loadNotifications() {
            const container = document.getElementById('notificationsContainer');
            
            const res = await apiFetch("/notifications/notifications");
            if (!res || !res.ok) {
                container.innerHTML = `
                    <div style="background: var(--surface-white); border: 1px solid var(--border-soft); border-radius: 20px; padding: 64px 32px; text-align: center; color: var(--text-muted);">
                        <p>Error loading notifications.</p>
                    </div>`;
                return;
            }
            
            const notifications = await res.json();
            
            if (notifications.length === 0) {
                container.innerHTML = `
                    <div style="background: var(--surface-white); border: 1px solid var(--border-soft); border-radius: 20px; padding: 64px 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.02); text-align: center; color: var(--text-muted);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity: 0.3; margin-bottom: 16px;"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <h3 style="margin: 0 0 8px 0; font-size: 1.2rem; color: var(--text-main);">No new notifications</h3>
                        <p style="margin: 0; font-size: 0.95rem;">You're all caught up!</p>
                    </div>`;
                document.getElementById('markAllBtn').style.display = 'none';
                return;
            }
            
            document.getElementById('markAllBtn').style.display = 'inline-block';
            container.innerHTML = '';
            
            notifications.forEach(n => {
                const isUnread = !n.is_read;
                const borderStyle = isUnread ? 'border-left: 4px solid var(--brand-teal);' : 'border-left: 4px solid transparent;';
                const bgStyle = isUnread ? 'background: rgba(13, 148, 136, 0.05);' : 'background: var(--surface-white);';
                
                const notifDiv = document.createElement('div');
                notifDiv.style = `${borderStyle} ${bgStyle} border-radius: 12px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.02); display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; border-top: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); transition: all 0.2s ease; cursor: pointer;`;
                
                notifDiv.innerHTML = `
                    <div style="flex: 1;">
                        <h4 style="margin: 0 0 6px 0; font-size: 1.1rem; font-weight: ${isUnread ? '600' : '500'}; color: var(--text-color);">${n.title}</h4>
                        <p style="margin: 0 0 8px 0; font-size: 0.95rem; color: var(--text-muted); line-height: 1.5;">${n.message}</p>
                        <span style="font-size: 0.8rem; color: var(--text-muted); opacity: 0.8;">
                            ${n.created_at ? new Date(n.created_at).toLocaleString('en-US', { month: 'long', day: '2-digit', year: 'numeric' }) + ' - ' + new Date(n.created_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }) : 'Just now'}
                        </span>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-end;">
                        ${isUnread ? '<span style="width: 10px; height: 10px; border-radius: 50%; background: var(--brand-teal);"></span>' : ''}
                        <button style="background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;" title="Delete" onclick="deleteNotification(event, ${n.id})">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;
                
                if (isUnread) {
                    notifDiv.addEventListener('click', () => markRead(n.id));
                }
                
                container.appendChild(notifDiv);
            });
        }
        
        async function markRead(id) {
            await apiFetch(`/notifications/notifications/${id}/read`, { method: "PUT" });
            loadNotifications();
        }
        
        async function markAllRead() {
            await apiFetch(`/notifications/notifications/read-all`, { method: "PUT" });
            loadNotifications();
        }
        
        async function deleteNotification(event, id) {
            event.stopPropagation();
            if(confirm("Delete this notification?")) {
                await apiFetch(`/notifications/notifications/${id}`, { method: "DELETE" });
                loadNotifications();
            }
        }

        function logout() {
            localStorage.removeItem('token');
            sessionStorage.removeItem('token');
            window.location.href = '/auth.html';
        }
    </script>
    <script src="/js/pwa.js"></script>
</body>
</html>
